name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -w packages/core
      - run: npm run typecheck -w packages/core
      - run: npm run gates -w packages/core
      - run: npm test -w apps/landing
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/extension
      - run: npm run typecheck -w apps/extension
      - run: npm run build -w apps/extension
      - run: npm run size -w apps/extension
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w apps/extension
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/extension/.playwright, retention-days: 7 }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run zip -w apps/extension
      - run: sha256sum apps/extension/.output/*.zip
      - uses: actions/upload-artifact@v4
        with: { name: pasteguard-extension-zip, path: apps/extension/.output/*.zip, if-no-files-found: error, include-hidden-files: true }
